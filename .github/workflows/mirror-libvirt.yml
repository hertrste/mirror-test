name: Mirror libvirt

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mirror-libvirt.yml"
      - ".github/scripts/mirror-libvirt.sh"

permissions:
  contents: read

concurrency:
  group: mirror-libvirt
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror cyberus-technology/libvirt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate mirror token
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "${MIRROR_TOKEN}" ]; then
            echo "::error::Missing MIRROR_TOKEN secret. Configure a token that can write contents and workflows to this repository."
            exit 1
          fi

      - name: Mirror upstream refs
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          UPSTREAM_URL: https://github.com/cyberus-technology/libvirt.git
          BRANCH_PREFIX: libvirt/
          TAG_PREFIX: libvirt/
          PROTECTED_BRANCHES: main
        run: ./.github/scripts/mirror-libvirt.sh
